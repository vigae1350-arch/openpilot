# carrot-jetlink: keep the phone-link branch (carrot-jetlink) = newest
# ajouatom/openpilot carrot-wip + the phone-link patch from the release.
# Each run applies the patch to the newest carrot-wip and, when that differs
# from the branch, adds one commit on top of it (the comma's git pull stays a
# fast-forward). If the patch no longer applies nothing is pushed and the run
# fails (you get an email); the comma keeps its last good version.
name: carrot-jetlink sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours

permissions:
  contents: write

concurrency: carrot-jetlink-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sync carrot-jetlink with carrot-wip
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          PATCH_URL: https://github.com/vigae1350-arch/jetlink_vigae1350/releases/download/v0.8.2-custom/carrot-jetlink.patch
        run: |
          [ -n "$SYNC_TOKEN" ] || { echo "::error::SYNC_TOKEN secret is missing (Settings > Secrets and variables > Actions)"; exit 1; }
          export ORIGIN_URL="https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          export UPSTREAM_URL="https://github.com/ajouatom/openpilot.git"
          set -euo pipefail
          # target = newest carrot-wip + the phone-link patch. carrot-jetlink is moved to
          # that tree with a new commit whose only parent is carrot-jetlink itself, so
          # the comma's git pull is always a fast-forward and a shallow clone can push it.
          DEPTH="${DEPTH---depth=1}"
          rm -rf repo && git init -q repo && cd repo
          git config user.name carrot-jetlink-sync
          git config user.email carrot-jetlink-sync@users.noreply.github.com
          git remote add origin "$ORIGIN_URL"
          git remote add upstream "$UPSTREAM_URL"
          git fetch -q $DEPTH ${FETCH_OPTS:-} upstream carrot-wip:refs/remotes/upstream/carrot-wip
          curl -fsSL -o /tmp/carrot-jetlink.patch "$PATCH_URL"
          git checkout -q -b target upstream/carrot-wip
          if ! git apply --whitespace=nowarn --index /tmp/carrot-jetlink.patch; then
            echo "::error::the phone-link patch does not apply to the newest carrot-wip ($(git rev-parse --short upstream/carrot-wip)); carrot-jetlink left as it was. Ask for an updated patch."
            exit 1
          fi
          # fixes made after the release's patch, applied on top of it (skipped once the patch has them)
          python3 - <<'PY'
          import pathlib

          def fix(path, old, new):
            p = pathlib.Path(path)
            s = p.read_text()
            if new in s:
              return
            assert s.count(old) == 1, (path, old[:50])
            p.write_text(s.replace(old, new))

          A = 'openpilot/selfdrive/jetlink_adapter/__init__.py'
          fix(A, "  def __init__(self, model):\n    object.__setattr__(self, '_model', model)\n",
              "  # what jetlink's joining model reads off the small one that carrot's\n"
              "  # ModelState does not carry (sunnypilot's does); jetlink's own defaults\n"
              "  DEFAULTS = {'lat_delay': 0.0, 'PLANPLUS_CONTROL': 1.0, 'frame_drop_ratio': 0.0}\n\n"
              "  def __init__(self, model):\n    object.__setattr__(self, '_model', model)\n")
          fix(A, "  def __getattr__(self, name):\n    return getattr(self._model, name)\n",
              "  def __getattr__(self, name):\n    try:\n      return getattr(self._model, name)\n"
              "    except AttributeError:\n      if name in SmallModel.DEFAULTS:\n"
              "        return SmallModel.DEFAULTS[name]\n      raise\n")
          M = 'openpilot/selfdrive/modeld/modeld.py'
          fix(M, "    mt1 = time.perf_counter()\n    camera_age_at_run_ms",
              "    if jetlink_adapter is not None and isinstance(model, jetlink_adapter.CarrotModel):\n"
              "      # carrot-jetlink: the joining model's lag rule reads modeld's frame drops\n"
              "      model.frame_drop_ratio = frame_drop_ratio\n"
              "    mt1 = time.perf_counter()\n    camera_age_at_run_ms")
          PY
          git add -A
          python3 -m py_compile openpilot/selfdrive/modeld/modeld.py openpilot/system/manager/process_config.py \
            openpilot/selfdrive/selfdrived/selfdrived.py openpilot/selfdrive/jetlink_adapter/__init__.py
          tree=$(git write-tree)
          up=$(git rev-parse upstream/carrot-wip)
          if git ls-remote --exit-code --heads origin carrot-jetlink >/dev/null; then
            git fetch -q $DEPTH ${FETCH_OPTS:-} origin carrot-jetlink:refs/remotes/origin/carrot-jetlink
            cur=$(git rev-parse origin/carrot-jetlink)
            if [ "$(git rev-parse "$cur^{tree}")" = "$tree" ]; then echo "already up to date ($(git rev-parse --short "$cur"))"; exit 0; fi
            commit=$(git commit-tree "$tree" -p "$cur" -m "carrot-jetlink: carrot-wip $(git rev-parse --short "$up") + phone link")
          else
            commit=$(git commit-tree "$tree" -m "carrot-jetlink: carrot-wip $(git rev-parse --short "$up") + phone link")
          fi
          git push -q origin "$commit:refs/heads/carrot-jetlink"
          echo "pushed carrot-jetlink $(git rev-parse --short "$commit") = carrot-wip $(git rev-parse --short "$up") + phone link"
