# carrot-jetlink: keep the phone-link branch (carrot-jetlink) = newest
# ajouatom/openpilot carrot-wip + the phone-link patch from the release.
# Each run applies the patch to the newest carrot-wip and, when that differs
# from the branch, adds one commit on top of it (the comma's git pull stays a
# fast-forward). If the patch no longer applies nothing is pushed and the run
# fails (you get an email); the comma keeps its last good version.
name: carrot-jetlink sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours

permissions:
  contents: write

concurrency: carrot-jetlink-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sync carrot-jetlink with carrot-wip
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          PATCH_URL: https://github.com/vigae1350-arch/jetlink_vigae1350/releases/download/v0.8.2-custom/carrot-jetlink.patch
        run: |
          [ -n "$SYNC_TOKEN" ] || { echo "::error::SYNC_TOKEN secret is missing (Settings > Secrets and variables > Actions)"; exit 1; }
          export ORIGIN_URL="https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          export UPSTREAM_URL="https://github.com/ajouatom/openpilot.git"
          set -euo pipefail
          # target = newest carrot-wip + the phone-link patch. carrot-jetlink is moved to
          # that tree with a new commit whose only parent is carrot-jetlink itself, so
          # the comma's git pull is always a fast-forward and a shallow clone can push it.
          DEPTH="${DEPTH---depth=1}"
          rm -rf repo && git init -q repo && cd repo
          git config user.name carrot-jetlink-sync
          git config user.email carrot-jetlink-sync@users.noreply.github.com
          git remote add origin "$ORIGIN_URL"
          git remote add upstream "$UPSTREAM_URL"
          git fetch -q $DEPTH ${FETCH_OPTS:-} upstream carrot-wip:refs/remotes/upstream/carrot-wip
          curl -fsSL -o /tmp/carrot-jetlink.patch "$PATCH_URL"
          git checkout -q -b target upstream/carrot-wip
          if ! git apply --whitespace=nowarn --index /tmp/carrot-jetlink.patch; then
            echo "::error::the phone-link patch does not apply to the newest carrot-wip ($(git rev-parse --short upstream/carrot-wip)); carrot-jetlink left as it was. Ask for an updated patch."
            exit 1
          fi
          # fixes made after the release's patch, applied on top of it (skipped once the patch has them)
          python3 - <<'PY'
          import pathlib

          def fix(path, old, new):
            p = pathlib.Path(path)
            s = p.read_text()
            if new in s:
              return
            assert s.count(old) == 1, (path, old[:60])
            p.write_text(s.replace(old, new))

          fix('openpilot/common/jetlink_status.py', "\nLINK_STATUS = Path('/dev/shm/carrot-jetlink.json')\nMODEL_STATUS = Path('/dev/shm/carrot-jetlink-model.json')\nHOST_LABELS = {'jetson': 'jetSON', 'mac': 'MAC'}\n\n\ndef _read(path):\n",
              "\nLINK_STATUS = Path('/dev/shm/carrot-jetlink.json')\nMODEL_STATUS = Path('/dev/shm/carrot-jetlink-model.json')\nHOST_LABELS = {'jetson': 'jetSON', 'mac': 'MAC', 'phone': 'PHONE'}\n\n\ndef _read(path):\n")
          fix('openpilot/common/jetlink_status.py', "    return None\n  result = {'label': host_label(saved.get('peer')), 'state': link.get('state', 'disconnected'),\n            'severity': 'unknown', 'reason': '', 'addresses': [], 'temp_c': None,\n            'active': bool(model.get('active')), 'fresh': False}\n  model_error = str(model.get('error') or '')[:240] if not model.get('active') else ''\n  if model_error:\n    result.update(severity='error', reason=model_error)\n",
              "    return None\n  result = {'label': host_label(saved.get('peer')), 'state': link.get('state', 'disconnected'),\n            'severity': 'unknown', 'reason': '', 'addresses': [], 'temp_c': None,\n            'active': bool(model.get('active')), 'fresh': False, 'model': saved.get('model')}\n  model_error = str(model.get('error') or '')[:240] if not model.get('active') else ''\n  if model_error:\n    result.update(severity='error', reason=model_error)\n")
          fix('openpilot/selfdrive/carrot/web/src/features/tools/egpu_model.js', '    card.hidden = false;\n    card.dataset.state = host.severity === "error" ? "error" : "compiled";\n    card.classList.remove("is-running");\n    document.getElementById("egpuModelTitle").textContent = `${host.label} · Cinque v2`;\n    stateEl.textContent = t(`host_${host.severity || "unknown"}`);\n    detailEl.textContent = "";\n    progressEl.hidden = true;\n',
              '    card.hidden = false;\n    card.dataset.state = host.severity === "error" ? "error" : "compiled";\n    card.classList.remove("is-running");\n    document.getElementById("egpuModelTitle").textContent = `${host.label} · ${host.model || "Cinque v2"}`;\n    stateEl.textContent = t(`host_${host.severity || "unknown"}`);\n    detailEl.textContent = "";\n    progressEl.hidden = true;\n')
          fix('openpilot/selfdrive/jetlink_adapter/__init__.py', 'import sys\nimport tempfile\nimport threading\nfrom collections import namedtuple\nfrom pathlib import Path\n\n',
              'import sys\nimport tempfile\nimport threading\nimport time\nfrom collections import namedtuple\nfrom pathlib import Path\n\n')
          fix('openpilot/selfdrive/jetlink_adapter/__init__.py', "  threading.Thread(target=_mark_stable, name='jetlink-stable', daemon=True).start()\n  threading.Thread(target=_build_warp_when_offroad, name='jetlink-warp', daemon=True).start()\n  use_our_jetlink()\n  from jetlink.openpilot.owner import main as run_owner\n  run_owner(owner_config())\n\n",
              "  threading.Thread(target=_mark_stable, name='jetlink-stable', daemon=True).start()\n  threading.Thread(target=_build_warp_when_offroad, name='jetlink-warp', daemon=True).start()\n  use_our_jetlink()\n  threading.Thread(target=_status_loop, name='jetlink-status', daemon=True).start()\n  from jetlink.openpilot.owner import main as run_owner\n  run_owner(owner_config())\n\n")
          fix('openpilot/selfdrive/jetlink_adapter/__init__.py', '  Reads and writes go through to the model (input_queues, npy, prev_desire,\n  vision_input_names, usbgpu)."""\n\n  def __init__(self, model):\n    object.__setattr__(self, \'_model\', model)\n\n',
              '  Reads and writes go through to the model (input_queues, npy, prev_desire,\n  vision_input_names, usbgpu)."""\n\n  # what jetlink\'s joining model reads off the small one that carrot\'s\n  # ModelState does not carry (sunnypilot\'s does); jetlink\'s own defaults\n  DEFAULTS = {\'lat_delay\': 0.0, \'PLANPLUS_CONTROL\': 1.0, \'frame_drop_ratio\': 0.0}\n\n  def __init__(self, model):\n    object.__setattr__(self, \'_model\', model)\n\n')
          fix('openpilot/selfdrive/jetlink_adapter/__init__.py', '    return out\n\n  def __getattr__(self, name):\n    return getattr(self._model, name)\n\n  def __setattr__(self, name, value):\n    setattr(self._model, name, value)\n\n\nclass CarrotModel:\n  """jetlink\'s joining model as carrot\'s modeld drives it."""\n\n  usbgpu = False\n\n  def __init__(self, joined):\n    object.__setattr__(self, \'_joined\', joined)\n',
              '    return out\n\n  def __getattr__(self, name):\n    try:\n      return getattr(self._model, name)\n    except AttributeError:\n      if name in SmallModel.DEFAULTS:\n        return SmallModel.DEFAULTS[name]\n      raise\n\n  def __setattr__(self, name, value):\n    setattr(self._model, name, value)\n\n\n# carrot\'s Jetlink badge on the driving screen (openpilot.common.jetlink_status)\n# reads these; carrot\'s own jetlinkd writes them for a Jetson and is off while\n# the phone link is on, so modeld writes them for the phone\nBADGE_LINK = Path(\'/dev/shm/carrot-jetlink.json\')\nBADGE_MODEL = Path(\'/dev/shm/carrot-jetlink-model.json\')\nBADGE_PERIOD = 0.5\nBADGE_MODEL_NAME = \'Cinque v3\'\n_BADGE_STATES = {\'running\': \'ready\', \'ready\': \'ready\', \'joining\': \'connecting\', \'retrying\': \'loading\'}\n\n\ndef _write_json(path: Path, value: dict) -> None:\n  tmp = path.with_name(path.name + \'.phone.tmp\')\n  tmp.write_text(json.dumps(value))\n  os.replace(tmp, path)\n\n\ndef publish_badge(joined) -> None:\n  """PHONE (driving on the phone\'s model), PHONE READY, PHONE WAIT."""\n  now = time.monotonic()\n  state = getattr(joined, \'big_model_state\', \'unavailable\')\n  _write_json(BADGE_LINK, {\'state\': _BADGE_STATES.get(state, \'waiting\'), \'updated\': now, \'writer\': \'modeld\',\n                           \'model\': BADGE_MODEL_NAME, \'peer\': {\'carrot_host\': \'phone\', \'device\': \'phone\'}})\n  _write_json(BADGE_MODEL, {\'active\': state == \'running\', \'updated\': now})\n\n\ndef publish_owner_status(host_present: bool) -> bool:\n  """The owner\'s view for the web page and the badge whenever modeld is not\n  writing (parked, or modeld not on the joining model): waiting, or ready while\n  a phone holds the gadget. False when modeld\'s own report is current."""\n  now = time.monotonic()\n  try:\n    current = json.loads(BADGE_LINK.read_text())\n    if current.get(\'writer\') == \'modeld\' and 0 <= now - float(current[\'updated\']) < 3 * BADGE_PERIOD:\n      return False\n  except (OSError, ValueError, KeyError, TypeError, AttributeError):\n    pass\n  _write_json(BADGE_LINK, {\'state\': \'ready\' if host_present else \'waiting\', \'updated\': now, \'writer\': \'owner\',\n                           \'model\': BADGE_MODEL_NAME, \'peer\': {\'carrot_host\': \'phone\', \'device\': \'phone\'}})\n  _write_json(BADGE_MODEL, {\'active\': False, \'updated\': now})\n  return True\n\n\ndef _status_loop() -> None:\n  from jetlink.comma import gadget\n  while True:\n    try:\n      publish_owner_status(gadget.host_attached())\n    except Exception:\n      pass\n    time.sleep(1.0)\n\n\nclass CarrotModel:\n  """jetlink\'s joining model as carrot\'s modeld drives it."""\n\n  usbgpu = False\n  _badge_at = 0.0\n\n  def __init__(self, joined):\n    object.__setattr__(self, \'_joined\', joined)\n')
          fix('openpilot/selfdrive/jetlink_adapter/__init__.py', "    # a dropped camera frame: carrot advances the small model's history without\n    # publishing. jetlink's models keep their own history per frame sent, so\n    # the frame runs and is published as zoompilot's modeld does\n    return self._joined.run(bufs, transforms, inputs)\n\n  def __getattr__(self, name):\n    return getattr(self._joined, name)\n",
              "    # a dropped camera frame: carrot advances the small model's history without\n    # publishing. jetlink's models keep their own history per frame sent, so\n    # the frame runs and is published as zoompilot's modeld does\n    out = self._joined.run(bufs, transforms, inputs)\n    now = time.monotonic()\n    if now >= self._badge_at:\n      object.__setattr__(self, '_badge_at', now + BADGE_PERIOD)\n      try:\n        publish_badge(self._joined)\n      except Exception:\n        pass\n    return out\n\n  def __getattr__(self, name):\n    return getattr(self._joined, name)\n")
          fix('openpilot/selfdrive/modeld/modeld.py', "      'action_t': np.array([lat_action_t, long_action_t], dtype=np.float32),\n    }\n\n    mt1 = time.perf_counter()\n    camera_age_at_run_ms = (time.monotonic() - meta_main.timestamp_eof * 1e-9) * 1000\n    inference_cpu_start = time.thread_time()\n",
              "      'action_t': np.array([lat_action_t, long_action_t], dtype=np.float32),\n    }\n\n    if jetlink_adapter is not None and isinstance(model, jetlink_adapter.CarrotModel):\n      # carrot-jetlink: the joining model's lag rule reads modeld's frame drops\n      model.frame_drop_ratio = frame_drop_ratio\n    mt1 = time.perf_counter()\n    camera_age_at_run_ms = (time.monotonic() - meta_main.timestamp_eof * 1e-9) * 1000\n    inference_cpu_start = time.thread_time()\n")
          PY
          git add -A
          python3 -m py_compile openpilot/selfdrive/modeld/modeld.py openpilot/system/manager/process_config.py \
            openpilot/selfdrive/selfdrived/selfdrived.py openpilot/selfdrive/jetlink_adapter/__init__.py
          tree=$(git write-tree)
          up=$(git rev-parse upstream/carrot-wip)
          if git ls-remote --exit-code --heads origin carrot-jetlink >/dev/null; then
            git fetch -q $DEPTH ${FETCH_OPTS:-} origin carrot-jetlink:refs/remotes/origin/carrot-jetlink
            cur=$(git rev-parse origin/carrot-jetlink)
            if [ "$(git rev-parse "$cur^{tree}")" = "$tree" ]; then echo "already up to date ($(git rev-parse --short "$cur"))"; exit 0; fi
            commit=$(git commit-tree "$tree" -p "$cur" -m "carrot-jetlink: carrot-wip $(git rev-parse --short "$up") + phone link")
          else
            commit=$(git commit-tree "$tree" -m "carrot-jetlink: carrot-wip $(git rev-parse --short "$up") + phone link")
          fi
          git push -q origin "$commit:refs/heads/carrot-jetlink"
          echo "pushed carrot-jetlink $(git rev-parse --short "$commit") = carrot-wip $(git rev-parse --short "$up") + phone link"
